name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to your default branch name

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }} # You will need to set this secret in GitHub

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist # The folder the action should deploy.
          branch: gh-pages # The branch the action should deploy to.
